<!DOCTYPE html>
<html>  
    <head>
        <meta charset="utf-8">
        <title>サイトタイトル</title>
        <link rel="stylesheet" href="styles.css" />
        <meta name="description" content="サイトの概要をここに書くと、検索エンジンで検索結果表示に表示されます。" />
    </head>
    <body>
        <header>
            <div>ヘッダー部分。サイト名やロゴを入れることが多い</div>
        </header>

        <nav>
            <ul>
                <li>TOP</li>
                <li>ABOUT</li>
                <li>CONTACT</li>
            </ul>
        </nav>

        <main>
            <div>メインボディコンテンツ部分。</div>
            <h1>ブロック要素</h1>
            <div>ブロック要素</div>
            <p>ブロック要素</p>

            <span>インライン要素</span>
            <span>インタイン要素</span>

            <label>インライン要素</label>
            <label>インライン要素</label>

            <button>インライン要素</button>
            <button>インライン要素</button>
            <!-- 通常このような書き方はしない -->
            <h1 class="black" style="color: black">1つ目のh1要素:文字色は黒</h1>
            <h1 class="green" style="color: green">2つ目のh1要素:文字色は緑</h1>
            <img src="./images/chickens.png" alt="画像1" />
            <img src="https://sample-website.com/illustration-image-123456" alt="サンプル1" />
        </main>

        <aside>
            <div>サイドバー部分</div>
        </aside>

        <footer>
            <div>フッター部分。コピーライトなどを入れることが多い</div>
            <div>© Lilac</div>
        </footer>
    </body>
</html>
